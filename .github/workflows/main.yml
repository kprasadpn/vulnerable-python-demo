name: App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: kprasadpn/github-platform-workflows/.github/actions/codeql-init@main
        with:
          language: python
          build-mode: none

      - name: Build application
        uses: kprasadpn/github-platform-workflows/.github/actions/ci-build@main
        with:
          app-name: vulnerable-python-demo
          python-version: "3.11"

      - name: Run unit tests
        uses: kprasadpn/github-platform-workflows/.github/actions/ci-unit-test@main
        env:
          PYTHONPATH: ${{ github.workspace }}
        with:
          python-version: "3.11"

      - name: Analyze with CodeQL
        uses: kprasadpn/github-platform-workflows/.github/actions/codeql-analyze@main
        with:
          language: python

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: kprasadpn/github-platform-workflows/.github/workflows/dependency-review.yml@main
    with:
      # The demo intentionally pins legacy packages; keep high-severity
      # findings visible without blocking this compatibility workflow.
      fail-on-severity: critical

  secret-scan:
    uses: kprasadpn/github-platform-workflows/.github/workflows/secret-scan.yml@main
